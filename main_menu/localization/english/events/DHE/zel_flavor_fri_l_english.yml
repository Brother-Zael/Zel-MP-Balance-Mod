 zel_flavor_fri.1.title: "Frisian Revival"
 zel_flavor_fri.1.desc: "Greater Frisia once was a dominant power along the coast of northern europe under Charlemagne's empire. At long last we have returned to our former glory, with many now adopting our customs and mannerisms"
 zel_flavor_fri.1.a: "Glory to Frisia!"

