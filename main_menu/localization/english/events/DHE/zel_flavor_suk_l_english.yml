 zel_flavor_suk.1.title: "The Front Palace"
 zel_flavor_suk.1.desc: "When Ayutthaya and Sukhothai clashed, one of the many lasting impacts was the establishment of the Front Palace system that would exist until 1887. The favored son or brother of the ruler would be placed in residency at the Front Palace, serving as governor over Sukhothai in addition to being the heir apparent"
 zel_flavor_suk.1.a: "Establish the Front Palace"

 zel_flavor_suk.1.entry: "The Front Palace"