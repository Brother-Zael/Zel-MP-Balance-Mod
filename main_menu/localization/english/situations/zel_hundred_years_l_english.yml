l_english:
 hundred_years_war.901.title: "Betrayal of Burgundy"
 hundred_years_war.901.desc: "A mere week ago the hated Argmanacs attempted to murder our Duke, yet when petitioned in court the French monarch denied the claims against his faithful hound in Argmanac and once more demanded humiliating displays of fealty from the Duke, causing our Duke to storm out of court in righteous protest. Rumors abound, and already an English envoy has arrived with tantalizing offers of support. Is it time for our independence, at long last?"
 hundred_years_war.901.a: "By the Grace of God, we shall be free! Death to Armagnac, Death to France!"
 hundred_years_war.901.entry: "$hundred_years_war.901.title$"