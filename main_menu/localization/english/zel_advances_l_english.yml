l_english:
 supply_depot_advance_age_1_traditions: "Supply Depot Zel"
 supply_depot_advance_age_1_traditions_desc: "LET THERE BE FOOD IN THINE DEPOTS"

 zel_fri_haadlingen: "Haadlingen"
 zel_fri_haadlingen_desc: "Frisia's nobles were little more than petty chieftans and village heads who held no hereditary rights and could only maintain what they could manage to hold in life. Weaker than in other lands, it is much easier to return the wealth hoarded by these individuals back to the people."
 zel_fri_upstallesbam: "Revive the Upstallesbam"
 zel_fri_upstallesbam_desc: "The ancient and uniquely Frisian assembly tradition has fallen to the wayside. Time has come to revive this tradition and invoke the Upstallesbam of the sea towns once more."
 zel_fri_hollandic_wars: "Friso-Hollandic Wars"
 zel_fri_hollandic_wars_desc: "Our own version of the hundred years war, the Hollandic nobles consistent covetous attempts on our free land have done little save harden our people into proper warriors."
 zel_fri_fishers: "Frisian Fishers"
 zel_fri_fishers_desc: "Frisians have been fishers longer than history has been written - staunch tradition that fills our bellies and coffers alike even when times are hard."
 zel_fri_kill_saxons: "Frisian Defense"
 zel_fri_kill_saxons_desc: "Our chief threat in the current era has revealed itself to be our cousin-kin inland, who grow jealous of our immense privileges. Sturdy walls, and sturdy soldiers to guard them, are needed when such troubles reach the fore."
 zel_oma_frankincense: "Frankincense Monopoly"
 zel_oma_frankincense_desc: "Omani monopoly over Frankincense exports ensure a steady supply is maintained for our imams and sufis at less than market rates."
 zel_oma_imamate: "Omani Imamate"
 zel_oma_imamate_desc: "Though few remain to speak it, the Ibadi truth is compelling when heard, and quickly brings new residents of the ummah to enlightenment."
 zel_oma_portuguese: "Omani Navy"
 zel_oma_portuguese_desc: "Though the infidel Portuguese scoff at us as barbarians, it will be they who soon find their ships sinking to the abyss as the faithful rally to the sea."
 zel_aju_water_dynasty: "The Water Dynasty"
 zel_aju_water_dynasty_desc: "Ajuran's unique grasp of hydraulic engineering and subsiquent control over the wells and rivers of Somalia have led to the advancement of our mighty realm, and to the ruling class being referred to as a 'Water Dynasty'."
 zel_aju_trader: "Ajurani Traders"
 zel_aju_trader_desc: "Though we historically have focused inland to the vast wealth that can be seized from our weaker neighbors, this is no reason to ignore the seas. From Socotra to Madagascar, to even the Maldives, whever there is profit to be made our adventuresome merchants shall find it."
 zel_aju_maritime: "Maritime Somalis"
 zel_aju_maritime_desc: "With our increased naval presence, control flows along our coasts as it does through our rivers, bringing lands once foreign into our rightful and just control."
 zel_aju_nomads_I: "Nomadic Controls"
 zel_aju_nomads_I_desc: "With the wells and oasis firmly under grasp of the state, the many nomadic tribes have little choice but to submit to our rulership."
 zel_aju_nomads_II: "Nomadic Warriors"
 zel_aju_nomads_II_desc: "As the nomads grow used to our embrace and find peace within our lands, their warriors grow restless - eager to prove themselves in battles that no longer occur within our realm. They come to us offering their service so that we might channel this aggression elsewhere, and they might earn the glory they seek."
 zel_aju_army: "Modern Ajuran Army"
 zel_aju_army_desc: "Modernization of the Army has always been our great strength, and our control over the horn of africa has led us to discover many innovative tachniques used in lands visted by our merchants and diplomats. Incorporating these new ideals and technologies into the formidable Ajuran army will make us a land power that can no longer be ignored."
 zel_aju_madow_wars: "Gaal Madow Wars"
 zel_aju_madow_wars_desc: "The inland tribes have experienced plague, famine, drought, and other disasters, culminating in an invasion by the Oromo. It is the perfect opportunity for us to strike - a quick conquest that will bring new slaves to our armies, new prestige to our name, and new wealth to commfort our people."
 zel_snd_islam: "India's Gate to Islam"
 zel_snd_islam_desc: "Among the first converts to Islam in India, the Sindhi have developed a unique blend of practices that eases religious tensions and fosters a welcoming environment for curious minds and new converts."
 zel_snd_ancestry: "Soomru Ancestry"
 zel_snd_ancestry_desc: "The many and varied claims of our ancestry provide an opportunity to meld traditions and unify our people culturally."
 zel_snd_syncretism: "Sindhi Syncretism"
 zel_snd_syncretism_desc: "As Islam firmly takes root among our populace, the heathen practices of our ancestors are not scorned as they would be in other parts of the Islamic world. As we once were, they are now. As we are now, they will soon become - patience is the key to salvation. Praise be to Allah."
 zel_snd_gujdiplo: "Gujurati Ties"
 zel_snd_gujdiplo_desc: "Our position at the crossroads has brought us into conflict with many over the centuries. By maintaining close marriage and alliance ties to the Gujurati nobles, our southern flank is changed from a place of threat to a sanctuary for respite."
 zel_snd_indoislmaic: "Indoislamic Architecture"
 zel_snd_indoislmaic_desc: "From Thatta to Lahore, the unique blend of architectual styles of the Sindhi have impressed and astounded all who gave upon it - intricate craftsmanship that blends cultures, displays sublime artistry, and yet remains solid against the ravages of nature and time."
 zel_snd_border_guards: "Guardians of the Indus"
 zel_snd_border_guards_desc: "Long have outsiders invaded the Indus valley through the moutain passes on our border. The Sindhi have been tasked to defend those mountains for just as long, a task that only becomes more important as the threat to our west looms larger and larger."
 zel_snd_thatta: "Thatta, City of Wonder"
 zel_snd_thatta_desc: "Thatta is the model city, the beacon of development and advancement that all other realms seek to emulate."
 zel_mew_mew: "Mewari Mewar"
 zel_mew_mew_desc: "The Mewar people have existed for a millennia, and our state nearly as long as well. We are a storied people of legend, and proudly fight to preserve our great legacy."
 zel_mew_rana: "Rana Kshetra Singh"
 zel_mew_rana_desc: "The legendary Rana Kshetra Singh brought many lands into Mewari control, bringing Rajputana closest to unity since the islamic foes invaded."
 zel_mew_hindu_defenders: "The Hindu Defenders"
 zel_mew_hindu_defenders_desc: "Our islamic foes fear us as the 'Hindu Defenders'. We shall live up to this feared title."
 zel_mew_warrior_nation: "Warrior Nation"
 zel_mew_warrior_nation_desc: "Mewar has always been a Warrior Nation."
 zel_mew_favoring_hindus: "Favoring Hindus"
 zel_mew_favoring_hindus_desc: "Mewar's displeasure of muslims is no secret, and by favoring local Hindu leaders we can build a network of control that pushes the invaders out while securing internal alliances and stability."
 zel_rjp_gunsoftheraj: "Guns of the Rajputana"
 zel_rjp_gunsoftheraj_desc: "Rajputana is famed for warriors, and the introduction of firearms have only served to heighten this fear."
 zel_rjp_mining: "Rajputana Mining"
 zel_rjp_mining_desc: "The lands of Mewar, Marwar, and Malawa are rich in minerals and precious metals, an abundance that allows easy economic controls."
 zel_stn_ilyasshahi: "Ilyas Shahi"
 zel_stn_ilyasshahi_desc: "Ilyas Shahi is a legendary figure that birthed a unified, islamic Bengal. His conquests are a framework to greatness."
 zel_stn_satgaon_adm: "Satgaon Administration"
 zel_stn_satgaon_adm_desc: "Satgaon is a hub of administration that provides easy access into the dense wetlands of Bengal."
 zel_bng_shelltrade: "Shellcoin Trade"
 zel_bng_shelltrade_desc: "Trade with the Austronesian folks uses a currency of shell-based coinage, and easy to acquire resource that can expand Bengal's mercantile reach deep into Sumatra, Malacca, and even the lands beyond."
 zel_bng_army_of_shahi: "The Army of Shahi"
 zel_bng_army_of_shahi_desc: "The famed Shahi family have developed a system of martial heirarchy that has enabled strong military traditions focused around massed cavalry and elephant troops."
 zel_bng_control_arakhan: "Arakhan Control"
 zel_bng_control_arakhan_desc: "At it's height, Bengal controlled over Arakhan for centuries."
 zel_pin_drought_migrations: "Drought Migrations"
 zel_pin_drought_migrations_desc: "Droughts have devestated the upland fields, driving folk south and beyond our territories or into the few urban granaries we still have influence over."
 zel_pin_reestablish_control: "Reestablish Control"
 zel_pin_reestablish_control_desc: "Reestablishing Control over our hinterlands now that the severe droughts have ended is a matter of diplomatic priority as much as national security."
 zel_pin_miracle_of_survival: "Miracle of Survival"
 zel_pin_miracle_of_survival_desc: "Pinya's Survival through the previous troubles is nothing short of miraculous,."
 zel_pin_burmese_ascendency: "Burmese Ascendency"
 zel_pin_burmese_ascendency_desc: "Our Burmese greatness has been proven to all, and as we grow ascendant others will flock to adopt our mannerisms like moths to the flame."
 zel_pin_defend_from_shan: "Defend from Shan"
 zel_pin_defend_from_shan_desc: "The Shan raids on the Burmese is as a force of nature - as damaging to Pinya's food reserves and national unity as any drought."
 zel_pin_valley_march: "Valley Marches"
 zel_pin_valley_march_desc: "The Burmese river valleys are long, hot, and rugged. Marching is the cornerstone of military success in our homeland, just as much as access to food or weapons."
 zel_suk_freedom_fighters: "Freedom Fighters"
 zel_suk_freedom_fighters_desc: "Sukhothai are the original freedom fighters of the Thai, the first to overthrow the shackles of foreign oppressors."
 zel_suk_front_palace: "The Front Palace"
 zel_suk_front_palace_desc: "Unlocks The Front Palace"
 zel_suk_legacy: "Sukhothai Legacy"
 zel_suk_legacy_desc: "The Sukhothai Legacy is one of powerful families who willingly give their all for the Thai people."
 zel_dai_history: "Dai Viet History"
 zel_dai_history_desc: "Dai Viet History is long, and the origin of the Vietnamese people."
 zel_dai_champa: "Champa Conquest"
 zel_dai_champa_desc: "Conquest of Champa has long been the desire of the Dai Viet."
 zel_dai_le_reforms: "Le Dynasty Reforms"
 zel_dai_le_reforms_desc: "The later Le dynasty has initiated a series of reforms within Dai Viet that propel the Vietnamese people in a golden age of progress."
 zel_myi_cotton_shirts: "Ma-I Blueshirts"
 zel_myi_cotton_shirts_desc: "The Ma-I are famed for their cotton blue shirts, a stable of their markets and a sign of their strength."
 zel_myi_chi_trade: "The China Trade"
 zel_myi_chi_trade_desc: "The exports of Beeswax and Clay are famed goods that bring in great quantities of porcelain, silver, and silk. Ma-I Beeswax in particular is a famed good valued far above it's weight in gold; fuel for the scholars and palaces of the mainlanders."
 zel_myi_song_to_ming: "From the Song to the Ming"
 zel_myi_song_to_ming_desc: "Though the Ma-I have few written records, many records contain notice of them, from the earliest annals of the Song to the most recent entries of the Ming, a testament to the longevity of the Ma-I Bayan."
 zel_myi_bahay_kubo: "Bahay Kubo"
 zel_myi_bahay_kubo_desc: "The distinctively Filipino traditional 'cube house' is easily constructed, sufficiently durable, and amply mobile, a cornerstone shelter in a land so often tormented by destructive weather and invaders."
 zel_myi_bayan: "The Bayan"
 zel_myi_bayan_desc: "The Bayan, or fortified town, is the foundation of building up Filipino status."
 zel_myi_bay_to_min: "From Bay to Mindoro"
 zel_myi_bay_to_min_desc: "The Ma-I rule is across seas."
 zel_myi_southern_trade: "Southern Trade"
 zel_myi_southern_trade_desc: "Southern Trade expansion will prove beneficial to Ma-I."
 zel_myi_continental_trade: "Continental Trade"
 zel_myi_continental_trade_desc: "Trading with the Continent will ensure ample resources flow to the Ma-I."
 zel_myi_resist_spaniards: "Resist Spaniards"
 zel_myi_resist_spaniards_desc: "While others submit to foreign rule, the Ma-I fight on - some say it is a doomed fight, but the Ma-I are masters of these seas."
 zel_atj_islam: "The First Muslims"
 zel_atj_islam_desc: "The first to convert to Islam in south-east Asia, Aceh is the first among peers, and the home of the Austronesian Ummah."
 zel_atj_sword_of_islam: "The Sword of Islam"
 zel_atj_sword_of_islam_desc: "Unlocks the Sword of Islam"
 zel_atj_mighty_fleet: "Aceh's Mighty Fleet"
 zel_atj_mighty_fleet_desc: "Aceh's fleet grew to be renowned as the fiercest and most numerous naval force in Sumatra, reaching a height of 19,000 sailors and marines, outnumbering even the Portuguese colonial fleets."
 zel_atj_islamic_empire: "Islamic Empire"
 zel_atj_islamic_empire_desc: "The burgeoning Aceh Empire owes it's greatness as much to their Faith in Allah as to the rulership."
 zel_atj_indo_islamic_trade: "Indo-Islamic Trade"
 zel_atj_indo_islamic_trade_desc: "Aceh's shared religious faith with the Islamic ruling class in the sultanates of India provide a unique link that helps merchants and diplomats to build common bonds."
 zel_atj_conquer_pahang: "Conquest of Pahang"
 zel_atj_conquer_pahang_desc: "Aceh's conquest of Pahang opened the Tin mines to exploitation, a valuable and desperately needed resource."
 zel_atj_arabic_diplomats: "Arabic Diplomats"
 zel_atj_arabic_diplomats_desc: "Aceh's import of Arabic Diplomats, trained in the famed madrasas of Baghdad and Cairo, are skilled manipulators of foreign assumptions about Aceh."
 zel_atj_ottoman_relief: "Ottoman Support"
 zel_atj_ottoman_relief_desc: "Aceh's adherance to Islam is well known to the Caliph, leading to a historical alliance with the Ottomans who sent many shipmants of guns, ammunition, and other martial supplies."
 zel_grg_horses: "Gurgan Riders"
 zel_grg_horses_desc: "The Gurgan Riders blend unique mounts mixed from the swift mounts of the steppes to the stollid beasts of the persian highlands."
 zel_grg_grazelands: "Expanded Grazelands"
 zel_grg_grazelands_desc: "Meticulous control over the herds's grazing has led to expanded fields, meaning more food than ever can be gathered."
 zel_grg_last_borjigin: "Last Ilkhanan Borjigin"
 zel_grg_last_borjigin_desc: "Togha Temur and his descendants are the sole claimants to draw direct line to the great Chingghis Khan and are the only remaining rightful rulers of the Ilkhanate and Persia, drawing many of the former Ilkhanate vassals and loyal clans to the Togha Khanate's banner."
 zel_grg_shia_converts: "Shia Converts"
 zel_grg_shia_converts_desc: "The Hasar Clan of Gurgan converted from tengriism to sunni islam and then to shi'ite islam. While our path might not follow this route, it demonstrates the clan's expressive nature and willingness to experiment beyond the rules and regulations that bind others."
 zel_grg_original_timur: "Original Temurlane"
 zel_grg_original_timur_desc: "Togha Temur and his descendants' rightful claim were the basis used by Shuja-ud-din Timur, known more commonly as Temurlane, to claim succession over the lands of the Ilkhanate. While the so-called 'Sword of Islam' apes the grandeur of our family, the Gurgan are the true originators."