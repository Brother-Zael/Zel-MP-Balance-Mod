l_english:
 zIND_NAME: "Empire of the Indus"
 zIND_ADJ: "Indus"
 zIND_f: "the Empire of the Indus"
 zIND_f_desc: "Trhoughout the Millenia, many empires have come to dominate the Indus River Valley, but very few have been native to the region. To be the first to accomplish such a task would bring with it immense prestige and responsibilities."

 zBRM_NAME: "Burma"
 zBRM_ADJ: "Burmese"
 zBRM_f: "Burma"
 zBRM_f_desc: "Form the Burmese Empire."

 zFIL_NAME: "Maillard"
 zFIL_ADJ: "Maillard"
 zFIL_f: "Maillard"
 zFIL_f_desc: "Chinese records refer to the regions they traded with in the Philippines as Ma-I, or collectively Maillard. Ownership of these regions entitles us to this name, and the prestige ascribed to it by virtue of existing in ancient records of foreign lands."

 zFLP_NAME: "Panyupayana"
 zFLP_ADJ: "Filipino"
 zFLP_f: "Panyupayana"
 zFLP_f_desc: "Panyupayana is the Hindu name for our fair islands. Now that we have unified these lands in our sovereign way, we are truly Maharajas in our own right!"

 zPHL_NAME: "Philippines"
 zPHL_ADJ: "Filipino"
 zPHL_f: "the Philippines"
 zPHL_f_desc: "Unified at last, under the banner of the one true God!"

 zKMK_NAME: "Kumari Kandam"
 zKMK_ADJ: "Deccani"
 zKMK_f: "the Mythical Kumari Kandam"
 zKMK_f_desc: "Kumari Kandam is a mythical realm, akin to Atlantis, a great and advanced civilization in the south of India, free from oppression from northern invaders, unified and prosperous. We can now claim to be such a realm."

 zHRJ_NAME: "Hinduraj"
 zHRJ_ADJ: "Hindu"
 zHRJ_f: "the Central Raj"
 zHRJ_f_desc: "These lands stand at the center crossroads of all of India, a realm of untapped potential, with raw minerals aplenty, surrounded by defensible terrain, and home to fierce warriors. Let the Gujurati and the Bengali find their wealth and glory upon the seas, we shall find out wealth in blood, iron, and stone."