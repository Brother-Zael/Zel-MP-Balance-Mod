 # Zael
 judicate_of_masses_reform: "Judicate of the Masses"
 judicate_of_masses_reform_desc: "The High Judge has proclaimed that the primary purpose of the position is not to consolidate power amongst the elite but to ensure the safety and noble treatment of all righteous souls within our domain."
 zel_fri_upstallesbam_parliament: "Upstallesbam Parliament"
 zel_fri_upstallesbam_parliament_desc: "The ancient and uniquely Frisian assembly, abandoned in the previous decades, that establishes equality among the sea towns and brings all the leaders together to solve national problems in an equitable manner."
 zel_pin_burmese_autocracy: "Burmese Autocracy"
 zel_pin_burmese_autocracy_desc: "Burmese Autocratic rule promotes our national identity and stability above all."
 zel_atj_sword_of_islam_reform: "Sword of Islam"
 zel_atj_sword_of_islam_reform_desc: "Aceh has often been called the Sword of Islam, a thrust directly into the heart of infidel indonesia, bringing Allah's truth to the unfaithful... or failing that, then Allah's mercy."